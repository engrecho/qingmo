name: Build and release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a formal release after verification (false builds preview packages)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - dev/package.json
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dev
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
      - name: Build and core regressions
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qingmo-core.log) 2>&1
          trap 'echo "::error::$(tail -n 40 /tmp/qingmo-core.log | tr "\n" " " )"' ERR
          npm run build:renderer && npm run check:bundle && npm run test:startup && npm run test:auto-update && npm run test:mac-assoc && npm run test:core && npm run test:live-edit
      - name: Document interaction regressions
        timeout-minutes: 5
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qingmo-interactions.log) 2>&1
          trap 'echo "::error::$(tail -n 35 /tmp/qingmo-interactions.log | tr "\n" " " )"' ERR
          npm run test:update-network -- --no-sandbox --disable-gpu
          npm run test:update-flow -- --no-sandbox --disable-gpu
          echo "::notice::Running list regression"
          npm run test:lists -- --no-sandbox --disable-gpu
          echo "::notice::Running close regression"
          npm run test:close -- --no-sandbox --disable-gpu
          echo "::notice::Running outline regression"
          npm run test:outline -- --no-sandbox --disable-gpu
          echo "::notice::Running document lifecycle regression"
          npm run test:documents -- --no-sandbox --disable-gpu
      - if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qingmo-mac-build.log) 2>&1
          trap 'echo "::error::$(tail -n 25 /tmp/qingmo-mac-build.log | tr "\n" " " )"' ERR
          brew install poppler
          npm run test:pdf -- --no-sandbox --disable-gpu
          npx electron-builder --mac --arm64 --dir --publish never
          codesign --force --deep --sign - ../dist/mac-arm64/轻墨.app
          codesign --verify --deep --strict ../dist/mac-arm64/轻墨.app
          node scripts/verify-mac-assoc-native.js ../dist/mac-arm64/轻墨.app
          npx electron-builder --mac --arm64 --prepackaged ../dist/mac-arm64/轻墨.app --publish never
          node scripts/verify-asar.js ../dist/mac-arm64/轻墨.app/Contents/Resources/app.asar
          node scripts/publish.js mac
          node scripts/verify-mac.js
          version=$(node -p 'require("./package.json").version')
          mkdir -p ../release/upload
          cp "../release/macos/轻墨-${version}-mac-arm64.dmg" "../release/upload/QingMo-${version}-mac-arm64.dmg"
          cp "../release/macos/轻墨-${version}-mac-arm64.zip" "../release/upload/QingMo-${version}-mac-arm64.zip"
      - if: runner.os == 'Windows'
        run: |
          npx electron-builder --win --x64 --publish never
          node scripts/verify-asar.js ../dist/win-unpacked/resources/app.asar
          node scripts/publish.js win
          mkdir -p ../release/upload
          cp ../release/windows/*.exe ../release/upload/
          cp ../release/windows/latest.yml ../release/upload/
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: release/upload/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release/upload
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./dev/package.json").version')
          tag="v${version}"
          if [ "$PUBLISH_RELEASE" != "true" ]; then tag="${tag}-preview-${GITHUB_RUN_ID}"; fi
          export RELEASE_TAG="$tag"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const v=require('./dev/package.json').version;
          const expected=[`QingMo-${v}-mac-arm64.dmg`,`QingMo-${v}-mac-arm64.zip`,`QingMo-${v}-win-setup.exe`,`QingMo-${v}-win-portable.exe`,'latest.yml'];
          const files=fs.readdirSync('release/upload');
          if(files.length!==expected.length || expected.some(n=>!files.includes(n))) throw Error('Incomplete release assets');
          const manifest=expected.map(name=>{const data=fs.readFileSync('release/upload/'+name);return {name,size:data.length,digest:'sha256:'+crypto.createHash('sha256').update(data).digest('hex')}});
          fs.writeFileSync('/tmp/manifest.json',JSON.stringify(manifest));
          const yaml=fs.readFileSync('release/upload/latest.yml','utf8');
          const filename=/^path:\s*(.+)$/m.exec(yaml)?.[1].trim();
          if(filename!==`QingMo-${v}-win-setup.exe`) throw Error('Update manifest must target the setup installer');
          const sha512=/^sha512:\s*(.+)$/m.exec(yaml)?.[1].trim();
          if(sha512!==crypto.createHash('sha512').update(fs.readFileSync('release/upload/'+filename)).digest('base64')) throw Error('Update manifest checksum mismatch');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const version=require('./dev/package.json').version;
          const section=fs.readFileSync('RELEASE_NOTES.md','utf8').split(/\n## /)[0];
          if(!section.startsWith('## v'+version))throw Error('Release notes do not match package version');
          const notes=section.replace(/^##[^\n]*\n/,'').trim();
          fs.writeFileSync('/tmp/notes.md',notes+'\n\n提供 Windows x64 安装版 / 便携版、Mac Apple 芯片 DMG / ZIP。Mac 包仅本地签名，未完成 Apple 公证；Intel Mac 请勿使用 arm64 包。\n');
          NODE
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > /tmp/releases.json
          node - <<'NODE'
          const fs=require('fs');
          const tag=process.env.RELEASE_TAG;
          const releases=JSON.parse(fs.readFileSync('/tmp/releases.json')).flat().filter(r=>r.tag_name===tag);
          if(releases.length>1)throw Error('Multiple releases use this tag; resolve duplicates first');
          if(releases[0]&&!releases[0].draft)throw Error('Version already published; refusing to overwrite');
          const existing=releases[0];
          const target=process.env.SOURCE_SHA||process.env.GITHUB_SHA;
          if(existing&&existing.target_commitish!==target)throw Error('Draft targets a different source commit');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json'));
          const missing=[];
          for(const file of manifest){const asset=existing?.assets.find(a=>a.name===file.name);if(!asset)missing.push(file.name);else if(asset.size!==file.size||asset.digest!==file.digest)throw Error('Existing draft asset differs: '+file.name)}
          fs.writeFileSync('/tmp/release-id',existing?String(existing.id):'');
          fs.writeFileSync('/tmp/missing.txt',missing.join('\n')+(missing.length?'\n':''));
          fs.writeFileSync('/tmp/create.json',JSON.stringify({tag_name:tag,target_commitish:target,name:'轻墨 '+tag.slice(1),body:fs.readFileSync('/tmp/notes.md','utf8'),draft:true}));
          NODE
          release_id=$(cat /tmp/release-id)
          if [ -z "$release_id" ]; then
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/create.json --jq .id)
          fi
          while IFS= read -r asset; do gh release upload "$tag" "release/upload/$asset"; done < /tmp/missing.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > /tmp/remote.json
          node - <<'NODE'
          const fs=require('fs');
          const expected=JSON.parse(fs.readFileSync('/tmp/manifest.json'));
          const remote=JSON.parse(fs.readFileSync('/tmp/remote.json'));
          if(remote.assets.length!==expected.length)throw Error('Unexpected release asset count');
          for(const file of expected){const asset=remote.assets.find(a=>a.name===file.name);if(!asset||asset.size!==file.size||asset.digest!==file.digest)throw Error('Asset verification failed: '+file.name)}
          console.log('All five release assets match local size and SHA256');
          NODE
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true --jq .html_url
          else
            echo "Verified preview draft ID: $release_id (not published)"
          fi
