name: Publish verified packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing both verified package artifacts
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_RUN" in ''|*[!0-9]*) exit 1;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > /tmp/source-jobs.json
          node -e 'const jobs=require("/tmp/source-jobs.json").jobs.filter(j=>j.name.startsWith("build ("));if(jobs.length!==2||jobs.some(j=>j.conclusion!=="success"))throw Error("Both platform builds must succeed")'
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: packages-*
          merge-multiple: true
          path: release/upload
      - name: Upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qingmo-release.log) 2>&1
          trap 'echo "::error::$(tail -n 30 /tmp/qingmo-release.log | tr "\n" " " )"' ERR
          version=$(node -p 'require("./dev/package.json").version')
          tag="v${version}"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const v=require('./dev/package.json').version;
          const expected=[`QingMo-${v}-mac-arm64.dmg`,`QingMo-${v}-mac-arm64.zip`,`QingMo-${v}-win-setup.exe`,`QingMo-${v}-win-portable.exe`,'latest.yml'];
          const files=fs.readdirSync('release/upload');
          if(files.length!==expected.length || expected.some(n=>!files.includes(n))) throw Error('Incomplete release assets');
          const manifest=expected.map(name=>{const data=fs.readFileSync('release/upload/'+name);return {name,size:data.length,digest:'sha256:'+crypto.createHash('sha256').update(data).digest('hex')}});
          fs.writeFileSync('/tmp/manifest.json',JSON.stringify(manifest));
          const yaml=fs.readFileSync('release/upload/latest.yml','utf8');
          const filename=/^path:\s*(.+)$/m.exec(yaml)?.[1].trim();
          if(filename!==`QingMo-${v}-win-setup.exe`) throw Error('Update manifest must target the setup installer');
          const sha512=/^sha512:\s*(.+)$/m.exec(yaml)?.[1].trim();
          if(sha512!==crypto.createHash('sha512').update(fs.readFileSync('release/upload/'+filename)).digest('base64')) throw Error('Update manifest checksum mismatch');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const version=require('./dev/package.json').version;
          const section=fs.readFileSync('RELEASE_NOTES.md','utf8').split(/\n## /)[0];
          if(!section.startsWith('## v'+version))throw Error('Release notes do not match package version');
          const notes=section.replace(/^##[^\n]*\n/,'').trim();
          fs.writeFileSync('/tmp/notes.md',notes+'\n\n提供 Windows x64 安装版 / 便携版、Mac Apple 芯片 DMG / ZIP。Mac 包仅本地签名，未完成 Apple 公证；Intel Mac 请勿使用 arm64 包。\n');
          NODE
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > /tmp/releases.json
          node - <<'NODE'
          const fs=require('fs');
          const tag='v'+require('./dev/package.json').version;
          const releases=JSON.parse(fs.readFileSync('/tmp/releases.json')).flat().filter(r=>r.tag_name===tag);
          if(releases.length>1)throw Error('Multiple releases use this tag; resolve duplicates first');
          if(releases[0]&&!releases[0].draft)throw Error('Version already published; refusing to overwrite');
          const existing=releases[0];
          const target=process.env.SOURCE_SHA||process.env.GITHUB_SHA;
          if(existing&&existing.target_commitish!==target)throw Error('Draft targets a different source commit');
          const manifest=JSON.parse(fs.readFileSync('/tmp/manifest.json'));
          const missing=[];
          for(const file of manifest){const asset=existing?.assets.find(a=>a.name===file.name);if(!asset)missing.push(file.name);else if(asset.size!==file.size||asset.digest!==file.digest)throw Error('Existing draft asset differs: '+file.name)}
          fs.writeFileSync('/tmp/release-id',existing?String(existing.id):'');
          fs.writeFileSync('/tmp/missing.txt',missing.join('\n')+(missing.length?'\n':''));
          fs.writeFileSync('/tmp/create.json',JSON.stringify({tag_name:tag,target_commitish:target,name:'轻墨 '+tag.slice(1),body:fs.readFileSync('/tmp/notes.md','utf8'),draft:true}));
          NODE
          release_id=$(cat /tmp/release-id)
          if [ -z "$release_id" ]; then
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/create.json --jq .id)
          fi
          while IFS= read -r asset; do gh release upload "$tag" "release/upload/$asset"; done < /tmp/missing.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > /tmp/remote.json
          node - <<'NODE'
          const fs=require('fs');
          const expected=JSON.parse(fs.readFileSync('/tmp/manifest.json'));
          const remote=JSON.parse(fs.readFileSync('/tmp/remote.json'));
          if(remote.assets.length!==expected.length)throw Error('Unexpected release asset count');
          for(const file of expected){const asset=remote.assets.find(a=>a.name===file.name);if(!asset||asset.size!==file.size||asset.digest!==file.digest)throw Error('Asset verification failed: '+file.name)}
          console.log('All five release assets match local size and SHA256');
          NODE
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true --jq .html_url
