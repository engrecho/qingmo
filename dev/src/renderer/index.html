<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'" />
<title>轻墨</title>
<link rel="stylesheet" href="styles/common.css" />
<link rel="stylesheet" href="styles/mac.css" />
<link rel="stylesheet" href="styles/win.css" />
</head>
<body>
  <!-- SVG 图标雪碧图：统一 16px 线性风格，替代 emoji -->
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3.5l2 2.5H19a2 2 0 0 1 2 2V10"/><path d="M3 7v11a2 2 0 0 0 2 2h13.2a2 2 0 0 0 1.9-1.4L22 11H6.2a2 2 0 0 0-1.9 1.4L3 18"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
      <symbol id="i-bold" viewBox="0 0 24 24"><path d="M6 4h7a4 4 0 0 1 0 8H6z"/><path d="M6 12h8a4 4 0 0 1 0 8H6z"/></symbol>
      <symbol id="i-italic" viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5M15 4L9 20"/></symbol>
      <symbol id="i-strike" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.8 4"/><path d="M14 12a4 4 0 0 1 .8 7.9c-.6.3-1.3.5-2 .5H8"/><path d="M4 12h16"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/></symbol>
      <symbol id="i-h1" viewBox="0 0 24 24"><path d="M4 6v12M12 6v12M4 12h8"/><path d="M17 18v-8l2.5 1.5"/></symbol>
      <symbol id="i-h2" viewBox="0 0 24 24"><path d="M4 6v12M12 6v12M4 12h8"/><path d="M16 10a2 2 0 1 1 4 0c0 1.5-4 3-4 6h4"/></symbol>
      <symbol id="i-h3" viewBox="0 0 24 24"><path d="M4 6v12M12 6v12M4 12h8"/><path d="M16 9.5a2 2 0 1 1 3.6 1.2c-.6.8-1.6 1.1-1.6 1.1s1 .3 1.6 1.1A2 2 0 1 1 16 14.5"/></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
      <symbol id="i-quote" viewBox="0 0 24 24"><path d="M7 7h4v5a4 4 0 0 1-4 4zM15 7h4v5a4 4 0 0 1-4 4z"/></symbol>
      <symbol id="i-codeblock" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 10l-2 2 2 2M14 10l2 2-2 2"/></symbol>
      <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></symbol>
      <symbol id="i-ol" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 5h1.5v4M3.5 9h3M3.5 14a1.5 1.5 0 0 1 3 0c0 1.2-3 2-3 4h3M3.5 20h3"/></symbol>
      <symbol id="i-todo" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3.5 5.5l1.5 1.5 2.5-3"/><rect x="3" y="11" width="4.5" height="4.5" rx="1.2"/></symbol>
      <symbol id="i-hr" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M4 7h16M4 17h16" opacity=".28"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7L11.7 6.6"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-5.5 5.5L8 14l-5 5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M14 6.5l3.5 3.5"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3M8 6.5L12 3l4 3.5"/><path d="M4 15v3.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V15"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/></symbol>
      <symbol id="i-panel-close" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16M13 9l3 3-3 3"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
    </defs>
  </svg>

  <header class="titlebar" id="titlebar">
    <!-- 第一行：窗口控制（macOS 红绿灯 / 原生按钮）+ 折叠侧边栏 + 文件操作 + 居中标题 -->
    <div class="tb-row tb-row-1">
      <div class="brand">
        <button class="tb icon-only" id="btnPanel" title="折叠 / 展开侧边栏 (Ctrl+B)"><svg><use href="#i-panel"/></svg></button>
        <span class="tdiv"></span>
        <button class="tb" data-cmd="cmd:new"  title="新建 (Ctrl+N)"><svg><use href="#i-file-plus"/></svg></button>
        <button class="tb" data-cmd="cmd:open" title="打开 (Ctrl+O)"><svg><use href="#i-folder-open"/></svg></button>
        <button class="tb" data-cmd="cmd:save" title="保存 (Ctrl+S)"><svg><use href="#i-save"/></svg></button>
        <button class="tb" data-cmd="cmd:exportHtml" title="导出 HTML (Ctrl+Shift+E)"><svg><use href="#i-export"/></svg></button>
      </div>

      <span class="tb-title" id="fileName">未命名.md</span>

      <!-- 第一行右侧留空（Windows 的原生窗口按钮在这里，需要避让） -->
      <div class="tb-right"></div>
    </div>

    <!-- 第二行：编辑工具 + 视图切换 + 主题 -->
    <div class="tb-row tb-row-2">
      <div class="tools">
        <div class="tgroup">
          <button class="tb" data-cmd="fmt:h1" title="标题 1 (Ctrl+Alt+1)"><svg><use href="#i-h1"/></svg></button>
          <button class="tb" data-cmd="fmt:h2" title="标题 2 (Ctrl+Alt+2)"><svg><use href="#i-h2"/></svg></button>
          <button class="tb" data-cmd="fmt:h3" title="标题 3 (Ctrl+Alt+3)"><svg><use href="#i-h3"/></svg></button>
        </div>

        <span class="tdiv"></span>

        <div class="tgroup">
          <button class="tb" data-cmd="fmt:bold"   title="粗体 (Ctrl+B)"><svg><use href="#i-bold"/></svg></button>
          <button class="tb" data-cmd="fmt:italic" title="斜体 (Ctrl+I)"><svg><use href="#i-italic"/></svg></button>
          <button class="tb" data-cmd="fmt:strike" title="删除线 (Ctrl+Shift+X)"><svg><use href="#i-strike"/></svg></button>
          <button class="tb" data-cmd="fmt:code"   title="行内代码 (Ctrl+E)"><svg><use href="#i-code"/></svg></button>
          <button class="tb" data-cmd="fmt:clear"  title="清除当前行格式 (Ctrl/Cmd+\)" aria-label="清除当前行格式"><svg><use href="#i-clear"/></svg></button>
        </div>

        <span class="tdiv"></span>

        <div class="tgroup">
          <button class="tb" data-cmd="ins:table"  title="插入表格 (Ctrl+T)"><svg><use href="#i-table"/></svg></button>
          <button class="tb" data-cmd="ins:quote"  title="插入引用 (Ctrl+Shift+Q)"><svg><use href="#i-quote"/></svg></button>
          <button class="tb" data-cmd="ins:code"   title="代码块 (Ctrl+Shift+K)"><svg><use href="#i-codeblock"/></svg></button>
          <button class="tb" data-cmd="ins:ul"     title="无序列表 (Ctrl+Shift+8)"><svg><use href="#i-ul"/></svg></button>
          <button class="tb" data-cmd="ins:ol"     title="有序列表 (Ctrl+Shift+7)"><svg><use href="#i-ol"/></svg></button>
          <button class="tb" data-cmd="ins:todo"   title="任务列表 (Ctrl+Shift+9)"><svg><use href="#i-todo"/></svg></button>
          <button class="tb" data-cmd="ins:hr"     title="分隔线 (Ctrl+Shift+M)"><svg><use href="#i-hr"/></svg></button>
          <button class="tb" data-cmd="ins:link"   title="链接 (Ctrl+Shift+L)"><svg><use href="#i-link"/></svg></button>
          <button class="tb" data-cmd="ins:image"  title="图片 (Ctrl+Shift+I)"><svg><use href="#i-image"/></svg></button>
        </div>
      </div>

      <div class="tb-right">
        <div class="segbar" id="segbar">
          <button class="seg" data-view="edit"    title="仅编辑 (Ctrl+1)"><svg><use href="#i-edit"/></svg></button>
          <button class="seg active" data-view="split"   title="分栏 (Ctrl+2)"><svg><use href="#i-split"/></svg></button>
          <button class="seg" data-view="preview" title="仅预览 (Ctrl+3)"><svg><use href="#i-eye"/></svg></button>
        </div>
        <button class="tb icon-only" id="btnLive" title="预览区直接编辑 (Ctrl+Shift+P)">
          <svg><use href="#i-pencil"/></svg>
        </button>
        <span class="tdiv"></span>
        <!-- 主题切换放在第二行末尾：Windows 的原生窗口按钮占着第一行右侧，
             放那里会被挤到中间，看着不像「行末尾」 -->
        <button class="tb icon-only" id="btnTheme" title="切换深色模式 (Ctrl+D)">
          <svg class="ic-light"><use href="#i-moon"/></svg>
          <svg class="ic-dark"><use href="#i-sun"/></svg>
        </button>
        <button class="tb" id="btnOutline" title="显示或隐藏文档大纲" aria-controls="outline" aria-pressed="true">大纲</button>
        <button class="tb icon-only" id="btnSettings" title="设置">
          <svg><use href="#i-settings"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <span class="sb-title">打开的文件</span>
        <span class="sb-count" id="sbCount">0</span>
        <button class="sb-btn" id="btnCollapse" title="收起侧边栏">
          <svg viewBox="0 0 24 24"><use href="#i-panel-close"/></svg>
        </button>
      </div>
      <div class="sb-list" id="sbList"></div>
      <div class="sb-foot">
        <button class="sb-act" id="sbNew" title="新建 (Ctrl+N)">
          <svg viewBox="0 0 24 24"><use href="#i-file-plus"/></svg><span>新建文档</span>
        </button>
        <button class="sb-act" id="sbOpen" title="打开 (Ctrl+O)">
          <svg viewBox="0 0 24 24"><use href="#i-folder-open"/></svg><span>打开文件</span>
        </button>
        <button class="sb-act" id="sbCloseAll" title="关闭全部">
          <svg viewBox="0 0 24 24"><use href="#i-x"/></svg><span>关闭全部</span>
        </button>
      </div>
    </aside>

    <div class="sb-handle" id="sbHandle" title="拖动调整宽度 · 双击折叠">
      <span class="grip"></span>
    </div>

    <div class="main">
      <main class="panes" id="panes" data-mode="split">
        <section class="pane pane-edit">
          <div class="pane-tag">Markdown</div>
          <div id="editor"></div>
        </section>
        <div class="gutter" id="divider"><span></span></div>
        <section class="pane pane-view">
          <div class="pane-tag">预览</div>
          <article class="markdown-body" id="preview"></article>
        </section>
      </main>

      <footer class="statusbar">
        <span class="st-item" id="stPath">—</span>
        <span class="st-right">
          <span class="st-item" id="stSaved">已保存</span>
          <span class="st-sep"></span>
          <span class="st-item" id="stWords">0 字</span>
          <span class="st-item" id="stLines">0 行</span>
        </span>
      </footer>
    </div>
    <aside class="outline" id="outline" aria-label="文档大纲">
      <div class="sb-head"><span class="sb-title">文档大纲</span><button class="sb-btn" id="closeOutline" title="关闭大纲" aria-label="关闭大纲">×</button></div>
      <nav id="outlineList" aria-label="标题导航"></nav>
    </aside>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.bundle.js"></script>
  <script src="update.bundle.js"></script>
</body>
</html>
